name: Convertir documentos a Markdown

on:
  push:
    branches: [main]
    paths-ignore:
      - "documentacion/texto/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install pypdf python-docx
      - name: Convertir PDF y DOCX
        run: python scripts/convertir_documentos.py
      - name: Guardar versiones Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentacion/texto/**/*.md
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "docs: actualizar versiones Markdown de documentos"
            git push
          fi
